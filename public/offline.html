<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>인터넷 연결 확인 | 포 리뷰어</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f9fc;
        color: #1f2937;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        line-height: 1.7;
        word-break: keep-all;
      }
      main {
        width: min(100%, 400px);
        padding: 32px 24px;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        background: white;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #eff6ff;
        color: #2563eb;
      }
      h1 {
        font-size: 22px;
        margin: 20px 0 12px;
      }
      p {
        color: #526078;
        font-size: 14px;
        margin: 0 0 24px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 24px;
        color: white;
        background: #2563eb;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
      }
      a:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 24px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"
        ><svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        >
          <path
            d="M2 2l20 20M2 8.8a16 16 0 0 1 3-2M9 5.3A16 16 0 0 1 22 8.8M5 12a11 11 0 0 1 3.2-1.8M12 9.5a11 11 0 0 1 7 2.5M8.5 15.5a5 5 0 0 1 7 0M12 19h.01"
          /></svg
      ></span>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>
        리뷰와 정산 기록을 불러오려면 인터넷 연결이 필요해요. Wi-Fi 또는 모바일
        데이터를 연결한 뒤 다시 열어 주세요.
      </p>
      <a href="/">다시 연결</a>
      <small>포 리뷰어 · For Reviewer</small>
    </main>
  </body>
</html>
