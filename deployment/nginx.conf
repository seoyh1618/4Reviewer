server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    # Login tokens, query strings and personal fields are never written to access logs.
    access_log off;
    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# Accessible only through the private Docker bridge binding in compose.yml.
# The shared HTTPS ingress supplies the client address and terminates public TLS.
server {
    listen 8080;
    server_name forreviwer.com;
    server_tokens off;
    client_max_body_size 64k;
    access_log off;
    location / {
        proxy_pass http://app:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
